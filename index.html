<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-slider"></div>
        <button id="nav-calculator" class="active">Kalkulator</button>
        <button id="nav-streak">Kalkulator Streak</button>
        <button id="nav-countdown">Kira Detik</button>
    </nav>

    <main>
        <div id="calculator-section">
            <div class="calculator">
                <div class="display">
                    <input type="text" id="result" disabled>
                </div>
                <div class="buttons">
                    <!-- Scientific buttons -->
                    <button onclick="display('sin(')" class="sc-op sci-button">sin</button>
                    <button onclick="display('cos(')" class="sc-op sci-button">cos</button>
                    <button onclick="display('tan(')" class="sc-op sci-button">tan</button>
                    <button onclick="display('log(')" class="sc-op sci-button">log</button>
                    <button onclick="display('ln(')" class="sc-op sci-button">ln</button>
                    <button onclick="display('^')" class="operator sci-button">x^y</button>
                    <button onclick="display('sqrt(')" class="operator sci-button">√</button>
                    <button onclick="display('!')" class="operator sci-button">n!</button>
                    <button onclick="display('PI')" class="sc-op sci-button">π</button>
                    <button onclick="display('E')" class="sc-op sci-button">e</button>
                    <button onclick="display('(')" class="operator sci-button">(</button>
                    <button onclick="display(')')" class="operator sci-button">)</button>

                    <!-- Standard buttons -->
                    <button id="sci-toggle" class="sc-op">Sci</button>
                    <button onclick="clearScreen()" class="operator">C</button>
                    <button onclick="del()" class="operator">DEL</button>
                    <button onclick="display('/')" class="operator">/</button>
                    <button onclick="display('7')">7</button>
                    <button onclick="display('8')">8</button>
                    <button onclick="display('9')">9</button>
                    <button onclick="display('*')" class="operator">*</button>
                    <button onclick="display('4')">4</button>
                    <button onclick="display('5')">5</button>
                    <button onclick="display('6')">6</button>
                    <button onclick="display('-')" class="operator">-</button>
                    <button onclick="display('1')">1</button>
                    <button onclick="display('2')">2</button>
                    <button onclick="display('3')">3</button>
                    <button onclick="display('+')" class="operator">+</button>
                    <button onclick="display('0')">0</button>
                    <button onclick="display('.')">.</button>
                    <button onclick="calculate()" class="operator equal" style="grid-column: span 2;">=</button>
                </div>
            </div>
        </div>

        <div id="streak-calculator-section" class="is-hidden">
            <div class="streak-calculator">
                <h2>Kalkulator Streak</h2>
                <div class="streak-input">
                    <label for="streakStartDate">Tarikh Mula Streak:</label>
                    <input type="date" id="streakStartDate">
                    <button onclick="calculateStreak()">Kira</button>
                </div>
                <div id="streakResults"></div>
            </div>
        </div>

        <div id="countdown-section" class="is-hidden">
            <div class="page-container">
                <div class="countdown-container">
                    <h2>Kira Detik ke Tarikh</h2>
                    <div class="countdown-input">
                        <input type="datetime-local" id="countdown-date">
                        <button id="start-countdown">Mula</button>
                    </div>
                    <div id="countdown-display">
                        <div class="countdown-item"><span id="days">0</span> Hari</div>
                        <div class="countdown-item"><span id="hours">0</span> Jam</div>
                        <div class="countdown-item"><span id="minutes">0</span> Minit</div>
                        <div class="countdown-item"><span id="seconds">0</span> Saat</div>
                    </div>
                </div>
                <div class="timer-container">
                    <h2>Jam Randik (Timer)</h2>
                    <div id="timer-display">00:00:00</div>
                    <div class="timer-inputs">
                    <input type="number" id="timer-hours" placeholder="Jam" min="0">
                    <input type="number" id="timer-minutes" placeholder="Minit" min="0" max="59">
                    <input type="number" id="timer-seconds" placeholder="Saat" min="0" max="59">
                </div>
                <div class="timer-controls">
                    <button id="timer-start">Mula</button>
                    <button id="timer-pause">Jeda</button>
                    <button id="timer-reset">Set Semula</button>
                </div>
            </div>
            </div>
        </div>
    </main>

    <footer class="theme-selector">
        <button class="theme-button" title="Sunset Glow" data-gradient="linear-gradient(135deg, #ff9a9e, #fad0c4)"></button>
        <button class="theme-button" title="Ocean Breeze" data-gradient="linear-gradient(135deg, #00c6ff, #0072ff)"></button>
        <button class="theme-button" title="Lavender Dream" data-gradient="linear-gradient(135deg, #a18cd1, #fbc2eb)"></button>
        <button class="theme-button" title="Emerald Wave" data-gradient="linear-gradient(135deg, #00f260, #0575e6)"></button>
        <button class="theme-button" title="Golden Hour" data-gradient="linear-gradient(135deg, #f7971e, #ffd200)"></button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
